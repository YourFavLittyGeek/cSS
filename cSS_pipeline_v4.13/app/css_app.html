<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const api=async(u,b)=>{const r=await fetch(u,b?{method:"POST",headers:{"Content-Type":"application/json","X-CSS-App":"1"},body:JSON.stringify(b)}:{});const j=await r.json();if(j&&j.error&&r.status>=400)throw new Error(j.error);return j};
const toast=(t,bad)=>{const e=$("#toast");e.innerHTML=t;e.style.borderColor=bad?"var(--bad)":"var(--line)";e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",6000)};
// confirmation box: ask(title, html, [[value,label,class]...]) -> value of the button pressed
const ask=(title,html,btns)=>new Promise(res=>{$("#dlg").innerHTML=`<h2 class="warn">⚠ ${title}</h2><p>${html}</p><div class="acts">${btns.map(([v,l,c])=>`<button class="b ${c||""}" data-v="${v}">${l}</button>`).join("")}</div>`;
  $("#shade").style.display="flex";$("#dlg").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("#shade").style.display="none";res(b.dataset.v)})});
const PW=()=>S.pathways;const auto=()=>S.settings.auto_retry!==false;
const grade=(g,tip)=>g?`<span class="g g${g[0]==="A"?"A":g[0]==="B"?"B":"C"}" title="${esc(tip)}">${g}</span>`:'<span class="mut">—</span>';
/* 2026-11-25: every method list shows ✓ worked · ✗ tried and failed · ○ not tried yet · 🚫 not suitable (why); unsuitable = disabled */
const PW_STATE={worked:"worked",failed:"tried, failed",untried:"not tried yet",unsuitable:"not suitable"};
const pwSel=(cur,rec,attrs,tried,methods)=>{const t={};(tried||[]).forEach(x=>t[x.pathway]=x.shift);const M={};(methods||[]).forEach(m=>M[m.key]=m);
  const rank=k=>{const s=(M[k]||{}).state;return k===rec?0:s==="untried"?1:s==="worked"?2:s==="failed"?3:s==="unsuitable"?4:(k in t?3:1)};
  const ord=Object.keys(PW()).sort((a,b)=>rank(a)-rank(b));
  return `<select ${attrs}>${ord.map(k=>{const m=M[k],off=m&&m.state==="unsuitable"&&k!==cur;
    const tag=m?`${m.icon} `:(k in t?"✗ ":""),st=m?` · ${PW_STATE[m.state]}${m.why?": "+m.why:""}`:(k in t?`  · tried ✗ ${t[k]} mm`:"");
    return `<option value="${k}" ${k===cur?"selected":""} ${off?"disabled":""} title="${esc(m&&m.why||"")}">${tag}${PW()[k]}${["swi_only","synthmorph"].includes(k)?" (runs alone)":""} · ${S.pw_time[k]}${k===rec?"  (recommended)":""}${esc(st)}</option>`}).join("")}</select>`};
const pwList=p=>(p.methods||[]).length?`<table class="note" style="margin:6px 0">${p.methods.map(m=>`<tr><td>${m.icon}</td><td><b>${esc(PW()[m.key]||m.key)}</b></td><td>${esc(PW_STATE[m.state])}${m.why?" · "+esc(m.why):""}</td></tr>`).join("")}</table>`:"";
const recTag=(sel,rec)=>sel===rec?'<span class="rec">✓ recommended</span>':"";
async function openWin(url,name){const r=await api("/api/window",{url,title:name});if(r.open)window.open(url,name,"width=1150,height=560")}
async function confirmPath(code,chosen,rec,why){if(chosen===rec)return true;
  if(auto()){toast(`${sidH(code)}: ${esc(PW()[chosen])} chosen instead of the recommended ${esc(PW()[rec])} (automatic mode - no confirmation)`);return true}
  const r=await ask("Not the recommended pathway",`${sidH(code)}: you chose <b>${esc(PW()[chosen])}</b>, but the recommended pathway is <b>${esc(PW()[rec])}</b>${why?` (${esc(why)})`:""}. It may fail or give less accurate anatomy for this patient.`,[["back","Back"],["rec","Use recommended","pri"],["go","Continue anyway","wb"]]);
  return r==="go"?true:r==="rec"?"rec":false}
const hms=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${String(m).padStart(2,"0")} min`:m?`${m} min`:`${s % 60} s`};
// v5.20 ONE identifier rule: Standard (vault unlocked) = accession number everywhere; Incognito = de-identified code everywhere.
// The code is shown only on the Add studies and Studies screens. Internal file keys are never shown as identifiers.
function sidOf(code){const p=((typeof S!=="undefined"&&S&&S.patients)||[]).find(x=>x.code===code);return (p&&p.ident)||{}}
function sidStd(){const st=(typeof IDV!=="undefined"&&IDV.st)||{};return st.mode==="standard"}
function sid(code){const i=sidOf(code);if(sidStd()&&!i.locked&&i.accession)return i.accession;return i.deid_code||code}
function sidH(code){const i=sidOf(code);if(sidStd()){if(i.locked)return `${esc(i.deid_code||code)} <span title="identity vault locked - unlock to see the accession number">🔒</span>`;
    if(!i.accession)return `${esc(i.deid_code||code)} <span class="pill bad" title="enter the accession number (Edit)">accession missing</span>`;return esc(i.accession)}
  return esc(i.deid_code||code)}

const TITLES={

  shadow: ["Stage-1 shadow-mode prototype", "Older prototype (not SHADOW · Discovery Lab): the Unified Score engine run in shadow mode (predictions computed next to the pipeline for comparison; changes nothing, not used by PERCIVAL)"],
  studies: ["Studies", "Your project's studies, their status and results"],

  read: ["Review", "Read candidates in the reviewer, or run a blind read"],
  uni: ["uScore scorer (prototype, training disabled)", "Older prototype: the separate uScore model (nested CV, freeze) - training disabled (no expert-provenance safeguards); not used by PERCIVAL. Its x1–x5 predictors feed NOX automatically"],

};

async function refresh(){S=await api("/api/state");$("#ver").textContent=`pipeline ${S.version}`;{const sp=!!((S.settings||{}).features||{}).show_prototypes;document.querySelectorAll("[data-proto]").forEach(e=>e.style.display=sp?"":"none")}
  document.documentElement.dataset.theme=S.settings.theme||"dark";{const ic=`/icon_${S.settings.theme==="light"?"light":"dark"}.png`;if(!$("#logo").src.endsWith(ic)){$("#logo").src=ic;$("#fav").href=ic}}document.querySelectorAll("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.t===(S.settings.theme||"dark")));
  $("#projname").textContent=(S.project||{}).name||"—";$("#projname").title=(S.project||{}).path||"";
  $("#awakebox").innerHTML=`<label style="display:flex;gap:7px;align-items:center;cursor:pointer" title="Keep the Mac awake while studies are processing"><input type="checkbox" id="awk" ${S.settings.awake?"checked":""}> Keep Mac awake</label>`;
  $("#awk").onchange=async e=>{await api("/api/settings",{awake:e.target.checked});await refresh()};
  const P=S.patients.filter(p=>!p.archived&&!p.retired),att=P.filter(p=>["failed","stopped","decision"].includes(p.status)).length,run=P.filter(p=>["running","paused","starting","waiting"].includes(p.status)).length;
  $("#cnt_act").textContent=att?String(att):run?String(run):"";$("#cnt_act").classList.toggle("att",!!att);$("#cnt_studies").textContent=P.length?String(P.length):"";
  const lc=$("#logcode"),cur=lc.value;lc.innerHTML=S.patients.filter(p=>!p.retired).map(p=>`<option value="${esc(p.code)}">${esc(sid(p.code))}</option>`).join("");if(cur)lc.value=cur;else if(S.queue.running)lc.value=S.queue.running;

/* 2026-11-25: ONE Pensieve panel per study (replaces Archive / Stage / Verify / Clean of the older storage screens) */
const PV_LAB={on_mac:"on the Mac",in_pensieve:"in Pensieve",copied:"copy in Pensieve",moving:"moving to Pensieve…",restoring:"coming back…",failed:"Pensieve move failed",detached:"detached"};
let PVS=null,PVT=0;
async function pvStates(force){if(force||!PVS||Date.now()-PVT>5000){try{const r=await api("/api/pensieve/summary");PVS=r&&r.ok?r:{studies:{}}}catch(e){PVS={studies:{}}}PVT=Date.now()}return PVS}
function pvCell(code){const st=((PVS||{}).studies||{})[code]||"on_mac",c=esc(code);
  const pill=`<span class="pill ${st==="in_pensieve"||st==="copied"?"mut":st==="failed"?"warn":st==="on_mac"?"":"pri"}" title="where this study's processed files are">${esc(PV_LAB[st]||st)}</span>`;
  const b=(a,t,tip)=>` <button class="b sm" data-pv-${a}="${c}" title="${esc(tip)}">${t}</button>`;
  return pill+(st==="on_mac"?b("move","Move to Pensieve","copy to the Pensieve drive, check every file, then free the Mac copy"):"")
    +(st==="in_pensieve"?b("back","Bring back","copy the study back to the Mac (checked)"):"")+(st==="copied"||st==="in_pensieve"?b("check","Check","read the Pensieve copy back and compare every file with its record"):"")}
function pvBind(el,after){
  el.querySelectorAll("[data-pv-move]").forEach(x=>x.onclick=async()=>{if(!confirm(`Move ${x.dataset.pvMove} to the Pensieve drive?\nEvery file is copied and checked first; the Mac copy is then removed. Opening the study brings it back.`))return;

  el.querySelectorAll("[data-pv-back]").forEach(x=>x.onclick=async()=>{const r=await api("/api/pensieve/restore",{code:x.dataset.pvBack});toast(r.ok?"bringing it back…":esc(r.error),!r.ok);await pvStates(true);after&&after()});
  el.querySelectorAll("[data-pv-check]").forEach(x=>x.onclick=async()=>{x.disabled=true;x.textContent="Checking…";const r=await api("/api/pensieve/check",{code:x.dataset.pvCheck});x.disabled=false;x.textContent="Check";
    toast(esc(r.message||r.error||""),!r.ok)})}
async function updateSidebarVaultStatus(){
  const p=$("#side-vault-pill"),s=$("#side-vault-sub"),b=$("#side-vault-eject"),em=$("#side-vault-emergency"),tm=$("#side-transfer-meter"),tt=$("#side-transfer-txt");

    const [chk, sum] = await Promise.all([
      api("/api/storage/eject_check"),
      api("/api/transfer/jobs?state=preparing,copying,flushing,verifying,committing,removing_sources,rolling_back,recovering&limit=500")
    ]);
    const st=chk.state||"UNKNOWN";
    p.textContent=st;

  </div>
  <div class="card"><h2>Backup, export and library folders (this Mac only)</h2><div class="row"><span class="lab">Backup folder</span><input class="wide" id="bk" value="${esc(s.backup_dir||"")}" placeholder="e.g. /Volumes/LabDisk/cSS_backup"><button class="b" id="bkc">Choose…</button></div>
   <div class="row"><span class="lab">Export / share folder</span><input class="wide" id="xd" value="${esc(s.export_dir||"")}" placeholder="e.g. /Volumes/LabDisk/cSS_exports"><button class="b" id="xdc">Choose…</button></div>

   <div class="note">All must be existing local folders. Refused: ~/Desktop and ~/Documents (iCloud "Desktop &amp; Documents" can sync them silently), iCloud Drive, Dropbox, Google Drive, OneDrive and other cloud folders. Nothing is ever uploaded.</div></div>

  <div class="card" data-set="tempmri"><h2>Mac storage · temporary MRI copies</h2>
   <div class="note" style="margin-bottom:6px">At import Percival copies only the <b>series you chose</b> (SWI, T1, FLAIR) to the Mac. Once a study is <b>completely</b> processed those DICOM copies are no longer needed: re-runs use the converted NIfTI files, and your originals on the external drive are never touched. Failed, stopped or running studies keep their copy (Retry needs it).</div>
   <div class="row"><span class="lab">Delete the copies</span><select id="tm-pol"><option value="after_processing" ${(s.source_cleanup||"after_processing")==="after_processing"?"selected":""}>right after processing is complete (recommended)</option><option value="keep_days" ${s.source_cleanup==="keep_days"?"selected":""}>keep them for a number of days</option><option value="keep" ${s.source_cleanup==="keep"?"selected":""}>never (keep on the Mac)</option></select>
     <input id="tm-days" type="number" min="1" max="365" value="${esc(s.source_keep_days||7)}" style="width:70px;${s.source_cleanup==="keep_days"?"":"display:none"}"> <span class="note" id="tm-dl" style="${s.source_cleanup==="keep_days"?"":"display:none"}">days</span></div>

   <div class="row"><span class="lab">After the final review</span><select id="pv-pol"><option value="move" ${(s.pensieve_after_review||"move")==="move"?"selected":""}>move to Pensieve (recommended)</option><option value="copy" ${s.pensieve_after_review==="copy"?"selected":""}>copy to Pensieve, keep on the Mac</option><option value="off" ${s.pensieve_after_review==="off"?"selected":""}>do nothing</option></select>
     <span class="note">wait</span><input id="pv-grace" type="number" min="0" max="1440" value="${esc(s.pensieve_grace_min??5)}" style="width:60px"><span class="note">min after the final save</span></div>
   <div class="row"><span class="note" id="pv-sum">checking…</span><span class="sp"></span><button class="b" id="pv-earlier" style="display:none">Move earlier reviewed studies now</button></div>
